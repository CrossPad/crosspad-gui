name: Build API Docs

on:
  push:
    branches: [master]
    paths:
      - 'include/**'
      - 'src/**'
      - 'Doxyfile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Generate docs
        run: |
          mkdir -p docs/doxygen
          doxygen

      # GitHub Pages is unavailable on this plan for private repos — publish
      # the rendered docs as a build artifact instead (same as crosspad-core).
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/doxygen/html
