name: Build API Docs

on:
  push:
    branches: [master]
    paths:
      - 'include/**'
      - 'src/**'
      - 'Doxyfile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read   # pulls the CI image

# CI image: ghcr.io/crosspad/crosspad-ci (tools/ci/Dockerfile in platform-idf),
# the same image -- and so the same cmake, ninja, compilers and Python -- for
# every CrossPad repository, on an optional self-hosted runner (chosen by the
# repository variable CI_RUNNER, tools/ci_runner.py in platform-idf) and on
# GitHub's runners alike. It is pinned here by tag and digest (GHCR lets a tag
# be moved, not a digest); moving to a new image revision is a commit like any
# other. Unset CI_RUNNER when that runner goes offline:
# GitHub never falls back from a self-hosted label to a hosted runner.
jobs:
  docs:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/crosspad/crosspad-ci:v5.5.5-1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Doxygen 1.16.1 and graphviz are in the image.
      - name: Doxygen version
        run: doxygen --version

      - name: Generate docs
        run: |
          mkdir -p docs/doxygen
          doxygen

      # GitHub Pages is unavailable on this plan for private repos — publish
      # the rendered docs as a build artifact instead (same as crosspad-core).
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/doxygen/html
