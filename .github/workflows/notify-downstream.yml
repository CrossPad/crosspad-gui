name: Notify Downstream Repos

on:
  push:
    tags: ['v*']
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:

# Opt-in local runner (as in platform-idf, tools/ci_runner.py there): with the
# repository variable CI_RUNNER set (to `self-hosted`), jobs run on hardware
# machine inside a clean ubuntu:24.04 container -- root, nothing installed on
# the host. Unset, they run on ubuntu-latest exactly as before (an empty
# container image means no container). Unset the variable before that machine
# goes off; GitHub never falls back from a self-hosted label to a hosted runner.
# SECURITY: pull_request then runs the PR's code on hardware PC. Before this
# repository goes public, take pull_request off the self-hosted runner.
jobs:
  dispatch:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container: ${{ vars.CI_RUNNER && 'ubuntu:24.04' || '' }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        downstream:
          - repo: CrossPad/crosspad-pc
          - repo: CrossPad/ESP32-S3
          - repo: matixan/2playerCrosspad

    steps:
      # The hosted image has these; the container has none. git before
      # checkout, or actions/checkout falls back to a tarball.
      - name: Base tools (container)
        if: vars.CI_RUNNER
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl xz-utils bzip2 python3 cmake ninja-build

      - name: Determine ref label
        id: label
        run: |
          REF="${{ github.ref }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/}"
            echo "short_sha=$TAG" >> $GITHUB_OUTPUT
          else
            echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT

      - name: Dispatch to ${{ matrix.downstream.repo }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DOWNSTREAM_PAT }}
          repository: ${{ matrix.downstream.repo }}
          event-type: submodule-update
          client-payload: >
            {
              "lib": "crosspad-gui",
              "sha": "${{ steps.label.outputs.sha }}",
              "short_sha": "${{ steps.label.outputs.short_sha }}",
              "ref": "${{ steps.label.outputs.ref }}"
            }
