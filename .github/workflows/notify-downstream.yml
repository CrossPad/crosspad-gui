name: Notify Downstream Repos

on:
  push:
    tags: ['v*']
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:

# Read-only token: the dispatch itself goes with DOWNSTREAM_PAT.
permissions:
  contents: read

jobs:
  dispatch:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    # GitHub's runner, whatever CI_RUNNER says, and no container: a few
    # seconds of API calls that need no tools, with a PAT that reaches other
    # repositories -- not for the bench, where every job's container gets
    # the host's Docker socket. Only while GitHub's runners cannot start jobs
    # (Actions billing) set the repository variable CI_SECRETS_RUNNER to
    # `self-hosted`, and unset it again after.
    runs-on: ${{ vars.CI_SECRETS_RUNNER || 'ubuntu-latest' }}
    # A fork has no DOWNSTREAM_PAT: the job then says so and does nothing,
    # rather than failing on an empty token.
    env:
      DOWNSTREAM_PAT: ${{ secrets.DOWNSTREAM_PAT }}

    strategy:
      fail-fast: false
      matrix:
        downstream:
          - repo: CrossPad/crosspad-pc
          - repo: CrossPad/ESP32-S3
          - repo: matixan/2playerCrosspad

    steps:
      - name: No DOWNSTREAM_PAT -- nothing to notify
        if: env.DOWNSTREAM_PAT == ''
        run: echo "::notice::DOWNSTREAM_PAT is not set in this repository; ${{ matrix.downstream.repo }} is not notified."

      - name: Determine ref label
        if: env.DOWNSTREAM_PAT != ''
        id: label
        run: |
          REF="${{ github.ref }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/}"
            echo "short_sha=$TAG" >> $GITHUB_OUTPUT
          else
            echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT

      - name: Dispatch to ${{ matrix.downstream.repo }}
        if: env.DOWNSTREAM_PAT != ''
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0   # v3.0.0
        with:
          token: ${{ env.DOWNSTREAM_PAT }}
          repository: ${{ matrix.downstream.repo }}
          event-type: submodule-update
          client-payload: >
            {
              "lib": "crosspad-gui",
              "sha": "${{ steps.label.outputs.sha }}",
              "short_sha": "${{ steps.label.outputs.short_sha }}",
              "ref": "${{ steps.label.outputs.ref }}"
            }
